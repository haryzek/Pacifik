<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Pacifik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{
  --bg:#0f1419; --card:#171d24; --card2:#1e252e; --line:#262e38;
  --text:#e8e2d6; --muted:#9a948a; --dim:#6b665e;
  --accent:#D9A441; --water:#4fc3c9; --warn:#e0654a; --ok:#7bb661;
  --serif:Georgia,"Times New Roman",serif; --ui:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--ui);overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent)}
#app{display:flex;flex-direction:column;min-height:100dvh}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(15,20,25,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(var(--sat) + 8px) 12px 8px}
.hrow{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--serif);font-size:19px;color:var(--accent);letter-spacing:.02em}
.brand small{font:11px var(--mono);color:var(--dim);margin-left:6px}
.spacer{flex:1}
.gps{font:11px var(--mono);color:var(--muted);display:flex;align-items:center;gap:5px}
.gps b{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.gps.on b{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.gps.sim b{background:var(--accent)}
.count{font:11px var(--mono);color:var(--muted)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.chip.on{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:600}
.chip.water.on{background:var(--water);border-color:var(--water)}
.chip.range{font-family:var(--mono);font-size:12px}
.chip.region{font-size:12px;color:var(--text)}
.chip.region.on{background:var(--card2);color:var(--accent);border-color:var(--accent);font-weight:500}
.search{display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:0 10px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.search span{color:var(--dim);font-size:14px}
.search input{flex:1;background:none;border:0;color:var(--text);font:14px var(--ui);outline:none;min-width:0;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--dim)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search button{color:var(--dim);font-size:16px;padding:0 2px}

/* quick actions */
.quick{display:flex;gap:6px;padding:8px 12px 0}
.quick a{flex:1;text-align:center;padding:7px 2px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:12px;white-space:nowrap}

/* list */
main{flex:1;padding:8px 12px calc(var(--sab) + 72px)}
.item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:active{background:var(--card)}
.thumb{flex:none;width:96px;height:72px;border-radius:8px;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .badge{position:absolute;left:0;bottom:0;padding:1px 5px;font:10px var(--mono);background:rgba(0,0,0,.55);color:#fff;border-top-right-radius:6px}
.body{flex:1;min-width:0}
.t{display:flex;align-items:baseline;gap:6px}
.name{font-family:var(--serif);font-size:16px;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{color:var(--accent);font-size:12px;flex:none}
.meta{font:11px var(--mono);color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.meta .dist{color:var(--text)}
.meta .arrow{display:inline-block;transition:transform .2s}
.why{font-family:var(--serif);font-style:italic;color:#c9c2b4;font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icons{font-size:12px;margin-top:2px;color:var(--muted)}
.icons .w{color:var(--water)} .icons .f{color:var(--warn)}
.sp{display:inline-block;font:600 10px var(--mono);padding:1px 6px;border-radius:4px;background:rgba(79,195,201,.15);color:var(--water);border:1px solid rgba(79,195,201,.4);margin-right:4px;vertical-align:middle}
.sp.must{background:rgba(217,164,65,.18);color:var(--accent);border-color:rgba(217,164,65,.5)}
.sp.near{opacity:.75}
.dayc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.dayc.today{border-color:var(--accent);box-shadow:0 0 0 1px rgba(217,164,65,.3)}
.dayc.past{opacity:.55}
.dayc h3{margin:0;font-family:var(--serif);font-weight:normal;font-size:17px;line-height:1.25}
.dayc .dm{font:11px var(--mono);color:var(--muted);margin:3px 0 6px;display:flex;gap:10px;flex-wrap:wrap}
.dayc .dm b{color:var(--accent);font-weight:600}
.dayc .note{font-size:13px;color:#c9c2b4;line-height:1.45;margin:6px 0}
.dayc .must{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.dayc .must a{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--text);text-decoration:none}
.dayc .must a.done{color:var(--ok);border-color:rgba(123,182,97,.5)}
.dayc .must a.mm{border-color:rgba(217,164,65,.5)}
.dayc .cheap{margin-top:8px;font-size:12px;color:var(--ok);font-family:var(--mono)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-family:var(--serif)}
.more{display:block;width:100%;padding:12px;text-align:center;color:var(--accent);font-family:var(--mono);font-size:13px}

/* placeholder gradients by category */
.c-coast{background:linear-gradient(135deg,#1c3a4a,#2c5e6e)} .c-forest{background:linear-gradient(135deg,#1c3a2a,#2f5a3a)}
.c-desert{background:linear-gradient(135deg,#5a3a1c,#8a5a2a)} .c-mountain{background:linear-gradient(135deg,#2a2f3a,#4a5060)}
.c-lake_river{background:linear-gradient(135deg,#1a3a4a,#2a6a7a)} .c-waterfall{background:linear-gradient(135deg,#1e3a4e,#3a7a8a)}
.c-geology{background:linear-gradient(135deg,#4a2a2a,#7a4a3a)} .c-scenic_drive{background:linear-gradient(135deg,#2a2a3a,#5a4a3a)}
.c-town{background:linear-gradient(135deg,#3a2a1a,#6a4a2a)} .c-motel_gem{background:linear-gradient(135deg,#4a1a3a,#8a2a4a)}
.c-food_gem{background:linear-gradient(135deg,#4a2a1a,#9a4a1a)} .c-culture{background:linear-gradient(135deg,#3a1a4a,#5a2a7a)}
.c-oddity{background:linear-gradient(135deg,#2a4a1a,#6a7a1a)} .c-dark_sky{background:linear-gradient(135deg,#0a0f2a,#1a2a5a)}
.c-hot_spring{background:linear-gradient(135deg,#4a1a1a,#9a3a2a)}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(15,20,25,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav button{flex:1;padding:8px 0 6px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:none}
.sheet.open{display:flex}
.panel{width:100%;height:100dvh;background:var(--bg);overflow-y:auto;padding-bottom:calc(var(--sab) + 24px);animation:up .18s ease-out;overscroll-behavior:contain}
@keyframes up{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.hero{height:min(46vw,280px);min-height:180px;background:var(--card2);position:relative;display:flex;align-items:center;justify-content:center;font-size:56px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .close{position:absolute;top:calc(var(--sat) + 10px);right:10px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px;backdrop-filter:blur(4px)}
.hero .credit{position:absolute;left:0;right:0;bottom:0;padding:2px 8px;font:10px var(--mono);color:#ccc;background:rgba(0,0,0,.5)}
.pad{padding:12px 16px}
h2{font-family:var(--serif);font-weight:normal;font-size:22px;line-height:1.2;margin:0 0 4px}
.sub{font:12px var(--mono);color:var(--muted)}
.whybig{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.4;color:var(--accent);margin:12px 0}
.desc{font-family:var(--serif);font-size:15px;line-height:1.5}
.rows{margin:12px 0;border-top:1px solid var(--line)}
.row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.row .k{flex:none;width:92px;color:var(--muted);font:12px var(--mono);padding-top:1px}
.row.warn .v{color:var(--warn)}
.box{border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0}
.box.yellow{background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.35)}
.box.water{background:rgba(79,195,201,.1);border:1px solid rgba(79,195,201,.35)}
.box.red{background:rgba(224,101,74,.12);border:1px solid rgba(224,101,74,.4)}
.box h4{margin:0 0 6px;font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{padding:10px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:14px;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);color:#1a1408;border-color:var(--accent);font-weight:600}
.btn.on{border-color:var(--ok);color:var(--ok)}
.btn[disabled]{opacity:.4}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font:11px var(--mono);padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--muted)}
textarea{width:100%;min-height:70px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:14px var(--serif)}

/* settings / sim */
.settings{padding:calc(var(--sat) + 16px) 16px 16px}
select,input[type=text]{width:100%;padding:10px;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--line);font:14px var(--ui)}
label.l{display:block;font:12px var(--mono);color:var(--muted);margin:10px 0 4px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 80px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:40;transition:transform .2s,opacity .2s;font-size:14px;pointer-events:none;max-width:90vw}
#dayban{position:fixed;left:12px;right:70px;z-index:15;background:rgba(15,20,25,.92);border:1px solid rgba(79,195,201,.5);border-radius:12px;padding:8px 12px;font:13px var(--ui);display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
#dayban b{font-family:var(--serif);font-weight:normal;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dayban button{color:var(--muted);font-size:18px;padding:0 4px}
.ab{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px var(--mono);color:#0f1419;border:2px solid #0f1419;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.nb{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px var(--mono);border:2px solid #0f1419;box-shadow:0 2px 6px rgba(0,0,0,.55)}
.nb.must{background:#D9A441;color:#0f1419}
.nb.add{background:#4fc3c9;color:#0f1419}
.nb.done{background:#7BB661;color:#0f1419}
#daylist{position:fixed;left:0;right:0;bottom:calc(60px + var(--sab));z-index:16;background:rgba(15,20,25,.96);border-top:1px solid rgba(79,195,201,.45);backdrop-filter:blur(8px);font:13px var(--ui)}
#daylist .dl-h{display:flex;align-items:center;gap:8px;padding:8px 12px}
#daylist .dl-h b{flex:1;font-family:var(--serif);font-weight:normal;font-size:14px;color:var(--water)}
#daylist .dl-h button{color:var(--muted);font-size:16px;padding:0 6px}
#daylist .dl-b{display:none;max-height:44vh;overflow-y:auto;padding:0 12px 10px;-webkit-overflow-scrolling:touch}
#daylist.open .dl-b{display:block}
#daylist .dl-h2{padding:10px 0 4px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:8px}
.ds{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.ds .n{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 11px var(--mono);color:#0f1419;background:#D9A441}
.ds .n.add{background:#4fc3c9}
.ds .n.o{background:none;color:var(--muted);font-size:9px}
.ds.done .n{background:#7BB661}
.ds .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds .nm i{color:var(--muted);font-style:normal;font-size:11px}
.ds.done .nm{color:var(--muted);text-decoration:line-through}
.ds.other .nm{color:var(--muted2,var(--muted))}
.ds .x{color:var(--muted);font-size:15px;padding:2px 6px;flex:0 0 auto}
#daylist .dl-bed{margin-top:10px;padding:8px 10px;border:1px solid rgba(217,164,65,.4);border-radius:10px;background:rgba(217,164,65,.07)}
#daylist .dl-bed .k{color:var(--accent);font-size:12px}
#daylist .dl-bed .v{font-family:var(--serif);font-size:15px;margin:2px 0 6px}
#daylist .opt{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:12px}
#daylist .opt .p{flex:0 0 34px;font:700 12px var(--mono);color:var(--ok)}
#daylist .opt .t{flex:0 0 auto;max-width:42%;color:var(--text)}
#daylist .opt .t[data-dayzoom]{color:var(--water);text-decoration:underline dotted}
#daylist .opt .w{flex:1;color:var(--muted)}
#daylist .sub{padding-top:6px}
.ab.a{background:var(--ok)} .ab.b{background:var(--accent)}
#ptr{position:fixed;left:50%;top:calc(var(--sat) + 8px);transform:translateX(-50%) translateY(-60px);z-index:26;width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent);transition:transform .15s;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#ptr.ready{background:var(--accent);color:#1a1408}
#ptr.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:translateX(-50%) translateY(10px) rotate(360deg)}}
#toast.action{pointer-events:auto;border-color:var(--accent);color:var(--accent);cursor:pointer}
#toast.show{transform:translateX(-50%);opacity:1}
#pina{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:96px;z-index:50;pointer-events:none;animation:pina 1.5s ease-out forwards}
@keyframes pina{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3) translateY(-40px)}}
.soon{padding:60px 20px;text-align:center;color:var(--muted);font-family:var(--serif)}
.loop{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.loop .t{gap:8px}.loop .rq{font:10px var(--mono);padding:2px 6px;border-radius:4px;background:var(--card2)}
.rq.good{color:var(--ok)} .rq.mid{color:var(--accent)} .rq.bad{color:var(--warn)}
.stops{font:12px var(--mono);color:var(--muted);margin-top:4px;line-height:1.6}
.stops a{color:var(--water);text-decoration:none}
.story{font-family:var(--serif);font-size:15px;line-height:1.55}
.doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.doc h3{margin:0 0 8px;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.doc .row .k{width:110px}.doc .v{font-family:var(--mono);font-size:13px;user-select:all}
.doc .v a{color:var(--water);text-decoration:none}
.mantra{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--accent);text-align:center;padding:14px;border:1px dashed rgba(217,164,65,.4);border-radius:12px;margin:10px 0}
.prak li{margin:6px 0;font-size:14px}
.sub-tabs{display:flex;gap:6px;padding:8px 0 4px}
.sub-tabs button{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
.sub-tabs button.on{background:var(--accent);color:#1a1408;font-weight:600;border-color:var(--accent)}
.pl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.pl .name{cursor:pointer}.pl .done .name{text-decoration:line-through;color:var(--dim)}
.pl input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
.pl .x{color:var(--dim);padding:4px 8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.day h3{margin:0 0 6px;font:600 12px var(--mono);color:var(--accent);display:flex;justify-content:space-between}
.day input{margin-bottom:6px}
.day .vis{font:11px var(--mono);color:var(--muted);margin-bottom:6px}
.spend-form{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.spend-form input,.spend-form select{padding:9px;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--line);font:14px var(--ui)}
.spend-form .full{grid-column:1/3}
.stat{display:flex;gap:8px;margin:10px 0}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:600 18px var(--mono)}.stat small{color:var(--muted);font:11px var(--mono)}
.stat .over b{color:var(--warn)} .stat .under b{color:var(--ok)}
.sp{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.sp .amt{font:600 14px var(--mono);width:70px}.sp .cat{color:var(--muted);font:11px var(--mono);width:60px}.sp .note{flex:1}
.sp .e{background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:0 4px}
.sp-edit{background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:8px;margin:6px 0}
.sp-edit .spend-form{margin:0}
.sp-tog{display:flex;gap:6px;margin:10px 0 4px}
.sp-tog button{flex:1;padding:7px;border-radius:8px;background:var(--card);color:var(--muted);border:1px solid var(--line);font:600 12px var(--mono);cursor:pointer}
.sp-tog button.on{color:var(--accent);border-color:var(--accent)}
.spd{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.spd .dd{font:600 12px var(--mono);width:70px;color:var(--muted)}.spd .amt{font:600 14px var(--mono);width:70px}.spd .br{flex:1;font:11px var(--mono);color:var(--muted)}.spd.today .dd{color:var(--accent)}
#map{position:fixed;left:0;right:0;top:0;bottom:0;z-index:5;background:#0b1015;display:none}
#map.on{display:block}
#map.on::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:1.5px solid rgba(217,164,65,.55);border-radius:50%;pointer-events:none;z-index:400;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.mapctl{position:fixed;right:12px;bottom:calc(var(--sab) + 72px);z-index:15;display:flex;flex-direction:column;gap:8px}
body.dl .mapctl{z-index:17;bottom:calc(var(--sab) + 110px)}

<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="brand">Pacifik<small id="countdown"></small></div>
      <div class="spacer"></div>
      <div class="count" id="count"></div>
      <button class="gps" id="gpsBtn" title="Poloha"><b></b><span id="gpsTxt">GPS</span></button>
    </div>
    <div id="toolbar"></div>
  </header>
  <main id="main"></main>
  <div id="map"></div>
  <div id="dayban" hidden><b id="daybanT"></b><button id="daybanX">✕</button></div>
  <div id="daylist" hidden></div>
  <div class="mapctl" id="mapctl" hidden>
    <button id="mapMe" title="Kde jsem">📍</button>
    <button id="mapLoops" title="Odbočky">🔁</button>
    <button id="mapTop" title="Jen ⭐">⭐</button>
    <button id="mapSpine" class="on" title="Páteř">🧭</button>
    <button id="mapCluster" class="on" title="Shlukování">🫧</button>
    <button id="mapFix" title="Fixnout polohu na střed mapy">📌</button>
  </div>
  <nav id="nav"></nav>
</div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="sheet" id="posSheet"><div class="panel settings" id="posPanel"></div></div>
<div id="toast"></div>
<div id="pina">🍹</div>
<div id="ptr">↓</div>

<script>
'use strict';
// ====================== KONSTANTY ======================
const TRIP = { start: new Date('2026-09-16T00:00:00'), end: new Date('2026-10-10T23:59:59'), days: 24 };
const RANGES = [30, 100, 300, 500, Infinity];
const CATS = { coast:'🌊', forest:'🌲', desert:'🏜', geology:'🏜', mountain:'🏔', lake_river:'💧', waterfall:'💧', hot_spring:'♨️', scenic_drive:'🛣', town:'🏘', motel_gem:'🛏', food_gem:'🍽', culture:'🎸', oddity:'👁', dark_sky:'🌌' };
const FILTERS = [
  { id:'coast', l:'🌊 Pobřeží', cats:['coast'] },
  { id:'forest', l:'🌲 Les', cats:['forest'] },
  { id:'desert', l:'🏜 Poušť/skály', cats:['desert','geology'] },
  { id:'mountain', l:'🏔 Hory', cats:['mountain'] },
  { id:'swim', l:'💧 Koupání', cats:['lake_river','waterfall','hot_spring'], swim:true, cls:'water' },
  { id:'drive', l:'🛣 Silnice', cats:['scenic_drive'] },
  { id:'town', l:'🏘 Města', cats:['town'] },
  { id:'motel', l:'🛏 Motel', cats:['motel_gem'] },
  { id:'food', l:'🍽 Žrádlo', cats:['food_gem'] },
  { id:'culture', l:'🎸 Kultura', cats:['culture'] },
  { id:'oddity', l:'👁 Oddity', cats:['oddity'] },
  { id:'night', l:'🌌 Noc', cats:['dark_sky'] },
];
const REGIONS = [['R1','Olympic · Seattle'],['R2','Columbia · N Oregon'],['R3','Oregon coast'],['R4','Crater Lake · Umpqua'],['R5','Redwoods · Lost Coast'],['R6','Mendocino · Point Reyes'],['R7','SF · Big Sur · SLO'],['R8a','Santa Barbara'],['R8','LA · Malibu'],['R8b','San Diego'],['R9','Pouště'],['R9b','Pouště II']];
const SIM = [
  ['Seattle', 47.6062, -122.3321], ['North Bend (Twin Peaks)', 47.4957, -121.7868], ['Port Angeles', 48.1181, -123.4307], ['Forks', 47.9503, -124.3854],
  ['Astoria', 46.1879, -123.8313], ['Cannon Beach', 45.8918, -123.9615], ['Newport OR', 44.6368, -124.0535], ['Florence', 43.9826, -124.0998], ['Bandon', 43.1190, -124.4084],
  ['Crater Lake', 42.9446, -122.1090], ['Brookings', 42.0526, -124.2840], ['Crescent City', 41.7558, -124.2026], ['Eureka', 40.8021, -124.1637], ['Fort Bragg', 39.4457, -123.8053],
  ['Point Reyes', 38.0690, -122.8069], ['San Francisco', 37.7749, -122.4194], ['Santa Cruz', 36.9741, -122.0308], ['Monterey', 36.6002, -121.8947], ['Big Sur', 36.2704, -121.8081],
  ['San Luis Obispo', 35.2828, -120.6596], ['Santa Barbara', 34.4208, -119.6982], ['Los Angeles', 34.0522, -118.2437], ['Joshua Tree', 34.1347, -116.3131], ['Palm Springs', 33.8303, -116.5453],
  ['San Diego (OB)', 32.7480, -117.2500],
];
const LS_KEY = 'pacifik.v1';

// ====================== STAV ======================
const S = {
  places: [], loops: [], tab: 'near', range: 100, filters: new Set(), rank1: false, south: false, shown: 100, q: '', region: null, spineOnly: false,
  pos: null, posMode: 'none', // 'gps' | 'sim' | 'last'
  store: loadStore(),
};
function loadStore(){ try { return Object.assign({ plan:[], visited:{}, notes:{}, lastPos:null, sim:null, range:100 }, JSON.parse(localStorage.getItem(LS_KEY)||'{}')); } catch(e){ return { plan:[], visited:{}, notes:{}, lastPos:null, sim:null, range:100 }; } }
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S.store)); } catch(e){ toast('localStorage plný nebo blokovaný'); } }

// ====================== UTIL ======================
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R = 6371;
function hav(a, b){ const dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function bearing(a, b){ const φ1=a.lat*Math.PI/180, φ2=b.lat*Math.PI/180, Δλ=(b.lng-a.lng)*Math.PI/180; const y=Math.sin(Δλ)*Math.cos(φ2), x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ); return (Math.atan2(y,x)*180/Math.PI+360)%360; }
const DIRS = ['S','SV','V','JV','J','JZ','Z','SZ'];
const dirName = (b) => DIRS[Math.round(b/45)%8];
function driveMin(km, road){ const v = (road==='paved') ? 70 : 70/1.6; return Math.round(km/v*60); }
function fmtMin(m){ return m<60 ? `${m} min` : `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`; }
function fmtKm(km){ return km<10 ? km.toFixed(1)+' km' : Math.round(km)+' km'; }
function swimOK(p){ return p.swim && p.swim.possible && ['allowed','tolerated'].includes(p.swim.legal); }

// --- projekce místa na trasu dne: kde na silnici je mu nejblíž (postup v km) a jak daleko od ní je ---
function routeCum(pts){ if (pts._cum) return pts._cum; const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i-1] + hav({lat:pts[i-1][0],lng:pts[i-1][1]}, {lat:pts[i][0],lng:pts[i][1]})); try { Object.defineProperty(pts, '_cum', { value: c, enumerable: false }); } catch(e){} return c; }
function projectOn(pts, p){
  const cum = routeCum(pts); let best = { t: 0, d: Infinity, at: pts[0] };
  const kx = Math.cos(p.lat * Math.PI / 180); // lng zkrácená podle šířky, ať projekce nelže
  for (let i = 1; i < pts.length; i++) {
    const ay = pts[i-1][0], ax = pts[i-1][1] * kx, by = pts[i][0], bx = pts[i][1] * kx;
    const py = p.lat, px = p.lng * kx;
    const dy = by - ay, dx = bx - ax, len2 = dy*dy + dx*dx;
    let u = len2 ? ((py - ay) * dy + (px - ax) * dx) / len2 : 0; u = Math.max(0, Math.min(1, u));
    const qy = ay + u * dy, qx = (ax + u * dx) / kx;
    const d = hav(p, { lat: qy, lng: qx });
    if (d < best.d) best = { t: cum[i-1] + u * (cum[i] - cum[i-1]), d, at: [qy, qx] };
  }
  return best;
}
// --- itinerář dne: zastávky v pořadí, jak je trasa míjí (MUST + ručně přidané) ---
function dayStops(d){
  if (!d) return [];
  const pts = d.geom || d.wp.map(w => [w[0], w[1]]);
  const extra = (S.store.dayAdd && S.store.dayAdd[d.day]) || [];
  const ids = [...new Set([...(d.must_ids || []), ...extra])];
  const out = [];
  for (const id of ids) {
    const p = S.places.find(x => x.id === id); if (!p) continue;
    const pr = projectOn(pts, p);
    out.push({ p, t: pr.t, off: pr.d, at: pr.at, must: (d.must_ids || []).includes(id) });
  }
  out.sort((a, b) => a.t - b.t);
  // nocleh patří na konec dne, i když ho trasa mine dřív (Astoria, SF)
  const bed = out.findIndex(s => s.p.category === 'motel_gem');
  if (bed > -1 && bed < out.length - 1) out.push(out.splice(bed, 1)[0]);
  out.forEach((s, i) => s.n = i + 1);
  return out;
}
let toastT; function toast(msg, ms=2200, onClick=null){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); t.classList.toggle('action', !!onClick); t.onclick = onClick; clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), ms); }
function pina(){ const p=$('#pina'); p.style.display='flex'; p.style.animation='none'; void p.offsetWidth; p.style.animation=''; setTimeout(()=>p.style.display='none',1500); }

// ====================== SLUNCE (NOAA zjednodušeně) ======================
function sunTimes(lat, lng, date = new Date()){
  const rad = Math.PI/180, J1970 = 2440588, J2000 = 2451545;
  const toJ = (d) => d.valueOf()/864e5 - 0.5 + J1970, fromJ = (j) => new Date((j + 0.5 - J1970) * 864e5);
  const d = toJ(date) - J2000, n = Math.round(d - 0.0009 + lng/360), ds = 0.0009 - lng/360 + n;
  const M = rad * (357.5291 + 0.98560028 * ds), C = rad * (1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
  const L = M + C + rad*102.9372 + Math.PI, dec = Math.asin(Math.sin(L)*Math.sin(rad*23.4397));
  const Jnoon = J2000 + ds + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  const h0 = rad * -0.833, phi = rad*lat;
  const w = Math.acos((Math.sin(h0) - Math.sin(phi)*Math.sin(dec)) / (Math.cos(phi)*Math.cos(dec)));
  const Jset = J2000 + (w/(2*Math.PI)) - lng/360 + n + 0.0009 + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  return { sunset: fromJ(Jset), sunrise: fromJ(Jnoon - (Jset - Jnoon)) };
}
function sunTxt(){
  if (!S.pos) return '';
  try {
    const now = new Date(); let { sunset, sunrise } = sunTimes(S.pos.lat, S.pos.lng, now);
    const hm = (d) => d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Los_Angeles' });
    if (now < sunset) { const min = Math.round((sunset - now)/60000); return `🌇 ${hm(sunset)} −${Math.floor(min/60)}:${String(min%60).padStart(2,'0')}`; }
    const t = sunTimes(S.pos.lat, S.pos.lng, new Date(now.getTime() + 864e5));
    return `🌅 ${hm(t.sunrise)}`;
  } catch(e) { return ''; }
}

// ====================== ODPOČET ======================
function countdown(){
  const now = new Date(); const d = (a,b)=>Math.ceil((a-b)/864e5);
  let t;
  const car = new Date('2026-09-17T00:00:00');
  if (now < TRIP.start) t = `za ${d(TRIP.start, now)} d`;
  else if (now < car) t = '✈ letím';
  else if (now <= TRIP.end) { const dn = d(now, car) + 1; t = dn <= 21 ? `D${dn}` : `SM ${dn - 21}`; }
  else t = 'doma';
  $('#countdown').textContent = t + (sunTxt() ? ' · ' + sunTxt() : '');
}

// ====================== POLOHA ======================
let watchId = null;
function setPos(lat, lng, mode){
  S.pos = { lat, lng }; S.posMode = mode;
  if (mode === 'gps') { S.store.lastPos = { lat, lng, t: Date.now() }; save(); }
  const g = $('#gpsBtn'); g.className = 'gps ' + (mode==='gps' ? 'on' : mode==='sim' ? 'sim' : '');
  $('#gpsTxt').textContent = mode==='gps' ? 'GPS' : mode==='sim' ? 'FIX' : mode==='last' ? 'POSL.' : '—';
  countdown();
  if (S.tab === 'map' && M.map) { drawMe(); drawMarkers(); } else render();
}
function startGPS(){
  if (S.store.sim) { const s = S.store.sim; setPos(s.lat, s.lng, 'sim'); return; }
  if (!navigator.geolocation) { fallbackPos('GPS není k dispozici'); return; }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(
    (p) => setPos(p.coords.latitude, p.coords.longitude, 'gps'),
    (e) => fallbackPos(e.code===1 ? 'GPS odmítnuto' : 'GPS nedostupné'),
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
  );
}
function fallbackPos(why){
  if (S.pos && S.posMode==='gps') return; // už máme, jen výpadek
  const l = S.store.lastPos;
  if (l) { setPos(l.lat, l.lng, 'last'); toast(`${why} — poslední známá poloha`); }
  else { setPos(SIM[0][1], SIM[0][2], 'sim'); toast(`${why} — nastav polohu ručně (tap na GPS)`); }
}
function fixPos(lat, lng, label){
  S.store.sim = { lat, lng }; save();
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  setPos(lat, lng, 'sim'); toast(`📌 Poloha: ${label || (lat.toFixed(3) + ', ' + lng.toFixed(3))}`);
}
function showOnMap(id){
  const p = S.places.find(x => x.id === id); if (!p) return;
  closeDetail(); S.tab = 'map'; render();
  const go = () => { if (!M.map) return setTimeout(go, 200); M.map.setView([p.lat, p.lng], Math.max(M.map.getZoom(), 12)); setTimeout(() => { drawMarkers(); M.layer.getLayers().forEach(mk => { const ll = mk.getLatLng(); if (Math.abs(ll.lat - p.lat) < 1e-6 && Math.abs(ll.lng - p.lng) < 1e-6) mk.openPopup(); }); }, 300); };
  setTimeout(go, 100);
}
function openPosSheet(){
  const cur = S.store.sim ? SIM.findIndex(s=>s[1]===S.store.sim.lat && s[2]===S.store.sim.lng) : -1;
  $('#posPanel').innerHTML = `
    <h2>Kde jsem</h2>
    <div class="sub">${S.pos ? `${S.pos.lat.toFixed(4)}, ${S.pos.lng.toFixed(4)} · ${S.posMode}` : 'poloha neznámá'}</div>
    <div class="btns"><button class="btn primary" id="useGps">📡 Použít GPS</button></div>
    <label class="l">Fixní poloha (bez signálu / plánování / test z Podolí)</label>
    <select id="simSel"><option value="">— vypnuto —</option>${SIM.map((s,i)=>`<option value="${i}" ${i===cur?'selected':''}>${esc(s[0])}</option>`).join('')}</select>
    <label class="l">nebo souřadnice „lat, lng"</label>
    <input type="text" id="simTxt" placeholder="36.27, -121.81">
    <div class="btns"><button class="btn" id="simOk">Nastavit</button><button class="btn" id="posClose">Zavřít</button></div>
    <div class="btns" style="margin-top:20px"><button class="btn" id="updBtn">🔄 Zkontrolovat novou verzi</button></div>
    <div class="sub">verze ${esc(S.store.offlineReady || '—')} · ${S.places.length} míst · ${navigator.onLine ? 'online' : 'offline'}</div>`;
  $('#posSheet').classList.add('open');
  $('#useGps').onclick = () => { S.store.sim = null; save(); $('#posSheet').classList.remove('open'); startGPS(); };
  $('#posClose').onclick = () => $('#posSheet').classList.remove('open');
  $('#updBtn').onclick = () => { toast('Kontroluji…', 1500); checkUpdate(false); };
  $('#simOk').onclick = () => {
    const txt = $('#simTxt').value.trim(); const i = $('#simSel').value;
    let lat, lng;
    if (txt) { const m = txt.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/); if (!m) return toast('formát: lat, lng'); lat=+m[1]; lng=+m[2]; }
    else if (i !== '') { lat = SIM[i][1]; lng = SIM[i][2]; }
    else { S.store.sim = null; save(); $('#posSheet').classList.remove('open'); startGPS(); return; }
    S.store.sim = { lat, lng }; save(); if (watchId!==null) { navigator.geolocation.clearWatch(watchId); watchId=null; }
    setPos(lat, lng, 'sim'); $('#posSheet').classList.remove('open');
  };
}

// ====================== VÝPOČET SEZNAMU ======================
function computed(){
  const all = S.range === Infinity;
  if (!S.pos && !all) return [];
  const q = S.q.trim().toLowerCase();
  const out = [];
  for (const p of S.places) {
    if (q && !(`${p.name} ${p.nearest_town||''} ${p.why_bob} ${p.region} ${(p.tags||[]).join(' ')}`.toLowerCase().includes(q))) continue;
    if (all && S.region && p.region !== S.region && !(S.region === 'R9' && p.region === 'R9b') ) continue;
    const km = S.pos ? hav(S.pos, p) : null;
    if (!all && km > S.range) continue;
    if (S.south && S.pos && p.lat > S.pos.lat + 0.05) continue;
    if (S.rank1 && p.rank !== 1) continue;
    if (S.spineOnly && !(p.spine && (p.spine.must || p.spine.km <= 15))) continue;
    if (S.spineOnly && S.spineDay && p.spine.day !== S.spineDay) continue;
    if (S.filters.size) {
      let ok = false;
      for (const f of FILTERS) if (S.filters.has(f.id) && (f.cats.includes(p.category) || (f.swim && swimOK(p)))) { ok = true; break; }
      if (!ok) continue;
    }
    out.push({ p, km, b: S.pos ? bearing(S.pos, p) : 0 });
  }
  if (all) out.sort((a, b) => a.p.spineIndex - b.p.spineIndex || a.p.rank - b.p.rank); else out.sort((a, b) => a.km - b.km);
  return out;
}

// ====================== RENDER ======================
function render(){
  renderNav();
  $('#toolbar').innerHTML = S.tab==='near' ? toolbarNear() : '';
  const m = $('#main');
  if (S.tab !== 'map') hideMap();
  if (S.tab === 'near') renderNear(m);
  else if (S.tab === 'loops') renderLoops(m);
  else if (S.tab === 'docs') renderDocs(m);
  else if (S.tab === 'plan') renderPlan(m);
  else if (S.tab === 'map') { renderMap(m); return; }
  else m.innerHTML = `<div class="soon">${{loops:'Odbočky',map:'Mapa',plan:'Plán & deník',docs:'Papíry'}[S.tab]} — brzy. 🥥</div>`;
}
function renderNav(){
  const tabs = [['near','📍','Kolem mě'],['loops','🔁','Odbočky'],['map','🗺','Mapa'],['plan','📝','Plán'],['docs','📄','Papíry']];
  $('#nav').innerHTML = tabs.map(t=>`<button data-tab="${t[0]}" class="${S.tab===t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('');
}
function toolbarNear(){
  const all = S.range === Infinity;
  return `<div class="search"><span>🔍</span><input type="search" id="q" placeholder="hledat místo, město, tag…" value="${esc(S.q)}" autocomplete="off">${S.q ? '<button id="qClear">✕</button>' : ''}</div>
  <div class="chips">
    <button class="chip range ${all?'on':''}" data-range="Infinity">☰ vše S→J</button>
    ${RANGES.filter(r=>r!==Infinity).map(r=>`<button class="chip range ${S.range===r?'on':''}" data-range="${r}">${r} km</button>`).join('')}
    <button class="chip ${S.south?'on':''}" data-toggle="south">⬇ jen dál po trase</button>
    <button class="chip ${S.rank1?'on':''}" data-toggle="rank1">⭐ jen top</button>
    ${todayDay() ? `<button class="chip ${S.spineOnly && S.spineDay === todayDay() ? 'on' : ''}" data-spinelist="${todayDay()}">🧭 dnes D${todayDay()}</button>` : ''}
    <button class="chip ${S.spineOnly?'on':''}" data-toggle="spineOnly">🧭 ${S.spineOnly && S.spineDay ? 'den ' + S.spineDay : 'jen páteř'}</button>
    ${S.spineOnly && S.spineDay ? `<button class="chip" data-spinemap="${S.spineDay}">🗺 mapa dne ${S.spineDay}</button>` : ''}
    <button class="chip" data-surprise="1">🎲 překvap mě</button>
  </div>
  ${all ? `<div class="chips">${REGIONS.map(([id,l])=>`<button class="chip region ${S.region===id?'on':''}" data-region="${id}">${l}</button>`).join('')}</div>` : ''}

function spendHtml(){

function drawMe(){
  if (!M.map || !S.pos) return;
  if (M.me) M.me.setLatLng([S.pos.lat, S.pos.lng]);
  else M.me = L.circleMarker([S.pos.lat, S.pos.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#D9A441', fillOpacity: 1 }).addTo(M.map).bindTooltip('já');
}
function drawMarkers(){
  if (!M.map) return;
  const b = M.map.getBounds().pad(0.2), z = M.map.getZoom();
  M.layer.clearLayers();
  const batch = [];
  for (const p of S.places) {
    if (M.dayFocus) {
      if (!(p.spine && p.spine.day === M.dayFocus && (p.spine.must || p.spine.km <= 15))) continue;
      if (M.dayIds && M.dayIds.has(p.id)) continue; // uz je na mape jako cislovana zastavka
    }
    else { if (M.top && p.rank !== 1) continue; if (z < 7 && p.rank === 3) continue; }
    if (!M.clustered && !b.contains([p.lat, p.lng])) continue;
    if (S.filters.size) { let ok = false; for (const f of FILTERS) if (S.filters.has(f.id) && (f.cats.includes(p.category) || (f.swim && swimOK(p)))) { ok = true; break; } if (!ok) continue; }
    const r = p.rank === 1 ? 7 : p.rank === 2 ? 5 : 4;
    const must = p.spine && p.spine.must;
    const mk = L.circleMarker([p.lat, p.lng], { radius: must ? r + 2 : r, color: must ? '#D9A441' : '#0f1419', weight: must ? 3 : 1, fillColor: CAT_COLOR[p.category] || '#aaa', fillOpacity: .95 });
    mk.bindPopup(`<b>${esc(p.name)}</b>${CATS[p.category]||''} ${'★'.repeat(4-p.rank)}${S.pos ? ' · ' + fmtKm(hav(S.pos, p)) : ''}${swimOK(p) ? ' · 💧' : ''}${p.spine ? '<br>' + spBadge(p) : ''}<br><a href="#" data-id="${p.id}" style="color:var(--accent)">otevřít →</a> &nbsp; <a href="#" data-here="${p.id}" style="color:var(--muted)">📌 jsem tu</a>`);
    batch.push(mk);
  }
  M.layer.addLayers ? M.layer.addLayers(batch) : batch.forEach((mk) => M.layer.addLayer(mk));
}
function drawLoops(){
  for (const l of S.loops) {
    const pts = l.geom || (l.waypoints || []).map(w => [w.lat, w.lng]); if (pts.length < 2) continue;
    const pl = L.polyline(pts, { color: '#D9A441', weight: 3, opacity: .8, dashArray: '6 6' }).bindPopup(`<b>${esc(l.name)}</b>${l.total_km} km · ${l.driving_hours} h<br><a href="#" data-loop="${l.id}" style="color:var(--accent)">otevřít →</a>`);
    M.loops.addLayer(pl);
  }
}

function openDetail(id){
  const p = S.places.find(x => x.id === id); if (!p) return;
  const km = S.pos ? hav(S.pos, p) : null, b = S.pos ? bearing(S.pos, p) : null;
  const online = navigator.onLine;
  const rows = [];
  if (p.time_needed) rows.push(['čas', p.time_needed]);
  if (p.effort && p.effort.type && p.effort.type !== 'none') rows.push(['námaha', `${{walk:'procházka',hike:'túra',drive:'jízda'}[p.effort.type]||p.effort.type} · ${p.effort.distance_km ?? '?'} km · ↑${p.effort.elevation_m ?? '?'} m · ${{easy:'lehké',moderate:'střední',hard:'těžké'}[p.effort.difficulty]||p.effort.difficulty||''}`]);
  const roadTxt = { paved:'asfalt', gravel_ok_sedan:'štěrk, sedan ok', rough_caution:'⚠ špatná cesta — pomalu, zvaž', ford:'⚠ brod — koncem září mělké; rozhodni očima, jinak pěšky' }[p.road_access] || p.road_access;
  rows.push(['cesta', roadTxt, /⚠/.test(roadTxt)]);
  if (p.fee) rows.push(['vstup', p.fee]);
  if (p.best_time) rows.push(['kdy', p.best_time]);
  if (p.nearest_town) rows.push(['město', p.nearest_town]);
  const sw = p.swim || {};
  const swimHtml = sw.possible ? `<div class="box ${sw.legal==='prohibited'?'red':'water'}"><h4>💧 Koupání${sw.legal==='prohibited'?' — ZAKÁZÁNO':''}</h4>
    ${sw.water ? `voda: ${esc(sw.water)} · ` : ''}${sw.temp_c_sept_oct ? `${esc(sw.temp_c_sept_oct)} °C · ` : ''}${sw.legal ? `${{allowed:'povoleno',tolerated:'tolerováno',prohibited:'zakázáno',unknown:'neznámo'}[sw.legal]||sw.legal} · ` : ''}${sw.solitude ? `samota: ${{high:'vysoká',medium:'střední',low:'nízká'}[sw.solitude]||sw.solitude}` : ''}
    ${sw.safety ? `<div style="color:var(--warn);margin-top:4px">⚠ ${esc(sw.safety)}</div>` : ''}</div>` : (sw.safety ? `<div class="box red">⚠ ${esc(sw.safety)}</div>` : '');
  const visited = S.store.visited[p.id]; const inPlan = S.store.plan.includes(p.id);
  const geo = `geo:${p.lat},${p.lng}?q=${p.lat},${p.lng}(${encodeURIComponent(p.name)})`;
  $('#panel').innerHTML = `
    <div class="hero c-${p.category}">${p.photo_local ? `<img src="photos/${p.photo_local}.jpg" alt="" onerror="this.remove()">` : (CATS[p.category]||'📍')}<button class="close" id="close">✕</button>${p.photo_local && p.photo && (p.photo.credit||p.photo.license) ? `<div class="credit">${p.photo.page ? `<a href="${esc(p.photo.page)}" target="_blank" rel="noopener" style="color:#ccc">` : ''}📷 ${esc(p.photo.credit||'')} · ${esc(p.photo.license||'')}${p.photo.page ? '</a>' : ''}</div>` : ''}</div>
    <div class="pad">
      <h2>${esc(p.name)}</h2>
      <div class="sub">${esc(p.nearest_town||'')} · ${esc(p.region)} · ${'★'.repeat(4-p.rank)}${km!=null ? ` · ${fmtKm(km)} ${dirName(b)} · ~${fmtMin(driveMin(km, p.road_access))}` : ''}</div>
      ${p.spine ? `<div class="sub" style="margin-top:6px">${spBadge(p)} ${p.spine.km} km od páteře · <a href="#" data-spineday="${p.spine.day}" style="color:var(--water)">den ${p.spine.day} →</a></div>` : ''}
      <div class="whybig">${esc(p.why_bob)}</div>
      ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}
      ${p.season_note_2026 ? `<div class="box yellow"><h4>2026</h4>${esc(p.season_note_2026)}</div>` : ''}
      ${swimHtml}
      <div class="rows">${rows.map(r=>`<div class="row ${r[2]?'warn':''}"><div class="k">${r[0]}</div><div class="v">${esc(r[1])}</div></div>`).join('')}</div>
      <div class="btns">
        <a class="btn primary" href="${online ? esc(p.links.maps) : '#'}" ${online ? 'target="_blank" rel="noopener"' : 'id="offlineNav"'}>🧭 Naviguj${online ? '' : ' (offline)'}</a>
        <a class="btn" href="${geo}">📱 Mapy app</a>
        ${p.links.official ? `<a class="btn" href="${esc(p.links.official)}" target="_blank" rel="noopener">🌐 Web</a>` : ''}
        ${p.links.wiki ? `<a class="btn" href="${esc(p.links.wiki)}" target="_blank" rel="noopener">📖 Wiki</a>` : ''}
        <a class="btn" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(p.name + ' ' + (p.nearest_town||'').split(',')[0])}" target="_blank" rel="noopener">🖼 Fotky online</a>
      </div>
      <div class="btns">
        <button class="btn ${inPlan?'on':''}" id="planBtn">${inPlan ? '✓ V plánu' : '➕ Do plánu'}</button>
        <button class="btn ${visited?'on':''}" id="visitBtn">${visited ? `✓ Byl jsem ${visited}` : '✓ Byl jsem tu'}</button>
        <button class="btn" id="mapBtn">🗺 Na mapě</button>
        <button class="btn ${S.posMode==='sim' && S.pos && Math.abs(S.pos.lat-p.lat)<1e-6 ? 'on' : ''}" id="hereBtn">📌 Jsem tu</button>
        <button class="btn" id="copyBtn">📋 ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</button>
        ${p.photo_local ? `<button class="btn" id="badPhoto">🚫 špatná fotka</button>` : ''}
      </div>
      <label class="l">📝 Poznámka</label>
      <textarea id="note" placeholder="…">${esc(S.store.notes[p.id]||'')}</textarea>
      ${(p.loop_ids||[]).length ? `<div class="box" style="background:var(--card2);border:1px solid var(--line)"><h4>🔁 Součást odboček</h4>${p.loop_ids.map(id => { const l = S.loops.find(x => x.id === id); return l ? `<div><a href="#" data-loop="${l.id}" style="color:var(--accent);text-decoration:none">${esc(l.name)}</a> <span class="sub">${l.total_km} km · ${l.days} d</span></div>` : ''; }).join('')}</div>` : ''}
      <div class="tags">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="sub" style="margin-top:10px">${p.id}${p.aliases ? ' · ' + p.aliases.join(', ') : ''}</div>
    </div>`;
  $('#sheet').classList.add('open'); $('#panel').scrollTop = 0; pushSheet();
  $('#close').onclick = closeDetail;
  const on = $('#offlineNav'); if (on) on.onclick = (e) => { e.preventDefault(); copy(`${p.lat},${p.lng}`); toast('Offline — souřadnice zkopírovány'); };
  $('#copyBtn').onclick = () => { copy(`${p.lat},${p.lng}`); toast('Souřadnice zkopírovány'); };
  $('#mapBtn').onclick = () => showOnMap(p.id);
  $('#hereBtn').onclick = () => { fixPos(p.lat, p.lng, p.name); closeDetail(); };
  const bp = $('#badPhoto'); if (bp) bp.onclick = () => { S.store.badPhotos = S.store.badPhotos || []; if (!S.store.badPhotos.includes(p.id)) S.store.badPhotos.push(p.id); save(); toast('Zapsáno do Záloha → špatné fotky'); };
  $('#planBtn').onclick = () => { const i = S.store.plan.indexOf(p.id); i<0 ? S.store.plan.push(p.id) : S.store.plan.splice(i,1); save(); openDetail(id); render(); };
  $('#visitBtn').onclick = () => {
    if (S.store.visited[p.id]) { delete S.store.visited[p.id]; }
    else { S.store.visited[p.id] = new Date().toISOString().slice(0,10); if (p.rank === 1) pina(); }
    save(); openDetail(id); render();
  };
  $('#note').oninput = (e) => { const v = e.target.value; if (v) S.store.notes[p.id] = v; else delete S.store.notes[p.id]; save(); };
}
function closeDetail(){ const was = $('#sheet').classList.contains('open'); $('#sheet').classList.remove('open'); if (was && history.state && history.state.sheet) history.back(); }
function pushSheet(){ if (!(history.state && history.state.sheet)) history.pushState({ sheet: true }, ''); }
window.addEventListener('popstate', () => { $('#sheet').classList.remove('open'); $('#posSheet').classList.remove('open'); });
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e) { prompt('Zkopíruj:', t); } }

// ====================== EVENTY ======================
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-range],[data-toggle],[data-filter],[data-id],[data-loop],[data-sub],[data-surprise],[data-region],[data-here],[data-spineday],[data-spinelist],[data-spinemap],[data-dayadd],[data-dayrm],[data-dayzoom],#qClear,#more');
  if (!t) { if (e.target === $('#sheet')) closeDetail(); if (e.target === $('#posSheet')) $('#posSheet').classList.remove('open'); return; }
  if (t.dataset.tab) { if (t.dataset.tab === 'map' && M.dayFocus) dayFocus(null); S.tab = t.dataset.tab; S.shown = 100; closeDetail(); render(); window.scrollTo(0,0); }
  else if (t.dataset.range) { S.range = t.dataset.range === 'Infinity' ? Infinity : +t.dataset.range; S.store.range = S.range === Infinity ? null : S.range; save(); S.shown = 100; render(); }
  else if (t.dataset.toggle) { S[t.dataset.toggle] = !S[t.dataset.toggle]; if (t.dataset.toggle === 'spineOnly') S.spineDay = null; S.shown = 100; render(); }
  else if (t.dataset.filter) { const f = t.dataset.filter; S.filters.has(f) ? S.filters.delete(f) : S.filters.add(f); S.shown = 100; render(); }
  else if (t.dataset.id) { e.preventDefault(); openDetail(t.dataset.id); }
  else if (t.dataset.loop) { e.preventDefault(); openLoop(t.dataset.loop); }
  else if (t.dataset.sub) { S.sub = t.dataset.sub; renderPlan($('#main')); }
  else if (t.dataset.region) { S.region = S.region === t.dataset.region ? null : t.dataset.region; S.shown = 100; render(); window.scrollTo(0,0); }
  else if (t.id === 'qClear') { S.q = ''; render(); }
  else if (t.dataset.spineday) { e.preventDefault(); closeDetail(); S.tab = 'plan'; S.sub = 'spine'; render(); const el = document.getElementById('spd' + t.dataset.spineday); if (el) el.scrollIntoView({ block: 'start' }); }
  else if (t.dataset.spinelist) { const day = +t.dataset.spinelist; if (S.tab === 'near' && S.spineOnly && S.spineDay === day) { S.spineOnly = false; S.spineDay = null; } else { S.tab = 'near'; S.range = Infinity; S.region = null; S.q = ''; S.spineOnly = true; S.spineDay = day; } render(); window.scrollTo(0,0); }
  else if (t.dataset.dayadd || t.dataset.dayrm) {
    e.preventDefault();
    const [day, id] = (t.dataset.dayadd || t.dataset.dayrm).split(':'); const k = +day;
    S.store.dayAdd = S.store.dayAdd || {}; const cur = S.store.dayAdd[k] || [];
    S.store.dayAdd[k] = t.dataset.dayadd ? [...new Set([...cur, id])] : cur.filter(x => x !== id);
    save(); dayFocus(k);
    toast(t.dataset.dayadd ? 'Zařazeno do trasy dne' : 'Vyřazeno z trasy dne', 1200);
  }
  else if (t.dataset.dayzoom) { e.preventDefault(); const [la, ln] = t.dataset.dayzoom.split(',').map(Number); if (M.map) M.map.setView([la, ln], 11); }
  else if (t.dataset.spinemap) { const day = +t.dataset.spinemap; S.tab = 'map'; render(); const go = () => M.map ? dayFocus(day) : setTimeout(go, 200); setTimeout(go, 250); }
  else if (t.dataset.here) { e.preventDefault(); const p = S.places.find(x => x.id === t.dataset.here); if (p) { fixPos(p.lat, p.lng, p.name); M.map && M.map.closePopup(); } }
  else if (t.dataset.surprise) { const l = computed().filter(x => !S.store.visited[x.p.id]); const top = l.filter(x => x.p.rank === 1); const pool = top.length ? top : l; if (!pool.length) return toast('Nic v dosahu — rozšiř'); openDetail(pool[Math.floor(Math.random()*pool.length)].p.id); }
  else if (t.id === 'more') { S.shown += 100; render(); }
});
$('#gpsBtn').onclick = openPosSheet;
document.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; S.shown = 100; renderNear($('#main')); const c = $('#qClear'); if (S.q && !c) e.target.insertAdjacentHTML('afterend', '<button id="qClear">✕</button>'); if (!S.q && c) c.remove(); } });
window.addEventListener('online', () => toast('Online'));
window.addEventListener('offline', () => toast('Offline — Naviguj ukáže souřadnice'));

// ====================== PULL TO REFRESH (PWA nemá vlastní) ======================
(function(){
  const el = $('#ptr'); let y0 = null, dy = 0, active = false;
  const TH = 80;
  document.addEventListener('touchstart', (e) => { if (S.tab === 'map' || $('#sheet').classList.contains('open') || $('#posSheet').classList.contains('open')) return; if (window.scrollY <= 0) { y0 = e.touches[0].clientY; dy = 0; active = true; } }, { passive: true });
  document.addEventListener('touchmove', (e) => { if (!active) return; dy = e.touches[0].clientY - y0; if (dy < 0 || window.scrollY > 0) { dy = 0; el.style.transform = ''; return; } const d = Math.min(dy, 120); el.style.transform = `translateX(-50%) translateY(${d * 0.6 - 60}px)`; el.classList.toggle('ready', dy >= TH); }, { passive: true });
  document.addEventListener('touchend', () => { if (!active) return; active = false; if (dy >= TH) { el.classList.add('spin'); el.textContent = '↻'; el.style.transform = 'translateX(-50%) translateY(10px)'; checkUpdate(true); setTimeout(() => location.reload(), 300); } else { el.style.transform = ''; el.classList.remove('ready'); } dy = 0; }, { passive: true });
})();

// ====================== START ======================
async function init(){
  countdown(); setInterval(countdown, 60000);
  S.range = S.store.range === null ? Infinity : (S.store.range || 100);
  render();
  try {
    const [pl, lo, al, sp] = await Promise.all([fetch('data/places.json').then(r=>r.json()), fetch('data/loops.json').then(r=>r.json()), fetch('data/alerts.json').then(r=>r.json()).catch(()=>null), fetch('data/spine-out.json').then(r=>r.json()).catch(()=>null)]);
    S.places = pl; S.loops = lo; S.alerts = al; S.spine = sp;
  } catch(e) { $('#main').innerHTML = `<div class="empty">Nepodařilo se načíst data.<br><small>${esc(e.message)}</small></div>`; return; }
  startGPS();
  render();
  initSW();
  const ls = document.createElement('script'); ls.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; ls.onload = () => { const cs = document.createElement('script'); cs.src = 'https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js'; cs.onload = cs.onerror = () => { if (S.tab === 'map') render(); }; document.head.appendChild(cs); }; document.head.appendChild(ls);
}

// ====================== PWA / OFFLINE ======================
let installPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; showInstall(); });
function showInstall(){
  if (!installPrompt || document.getElementById('installBtn')) return;
  const b = document.createElement('button'); b.id = 'installBtn'; b.className = 'chip on'; b.textContent = '⬇ Instalovat appku';
  b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 70px);z-index:25;box-shadow:0 4px 16px rgba(0,0,0,.5)';
  b.onclick = async () => { installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; b.remove(); };
  document.body.appendChild(b);
}
let swReg = null;
function reloadApp(){ if (swReg && swReg.waiting) swReg.waiting.postMessage('skipWaiting'); setTimeout(() => location.reload(), 150); }
function checkUpdate(silent){ if (!swReg) return; swReg.update().then(() => { if (!silent && !swReg.installing && !swReg.waiting) toast('Máš aktuální verzi ✓'); }).catch(() => { if (!silent) toast('Offline — nelze zkontrolovat'); }); }
function initSW(){
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.type === 'progress') $('#gpsTxt').title = `offline ${m.done}/${m.total}`;
    if (m.type === 'ready') { S.store.offlineReady = m.version; save(); toast('Offline připraveno ✓', 3000); }
    if (m.type === 'activated' && S.store.offlineReady && S.store.offlineReady !== m.version) { S.store.offlineReady = m.version; save(); toast('Nová verze — tapni pro obnovení', 8000, () => location.reload()); }
  });
  navigator.serviceWorker.register('sw.js').then((reg) => {
    swReg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) toast('Nová verze — tapni pro obnovení', 8000, reloadApp);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Nová verze stažena — tapni pro obnovení', 8000, reloadApp); });
    });
    // kontrola při každém návratu do appky (PWA nemá pull-to-refresh)
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(true); });
    setInterval(() => checkUpdate(true), 30 * 60 * 1000);
  }).catch(() => {});
  if (navigator.serviceWorker.controller && S.store.offlineReady) $('#gpsTxt').title = 'offline ✓';
}
init();
</script>
